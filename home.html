<!DOCTYPE html>
<html lang="pl">
<head>
    <title>mObywatel - Dokumenty</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="assets/main.css">
    <link rel="manifest" href="manifest.json">
    <style>
        .top_grid {
            display: flex;
            justify-content: space-between;
            padding: 40px 20px 20px 20px;
        }
        .top_image { width: 40px; height: auto; }
        
        .card_grid {
            padding: 0 20px;
            margin-bottom: 20px;
        }
        .title { font-size: 32px; font-weight: 700; margin: 0; }
        .subtitle-row { display: flex; gap: 15px; margin-top: 10px; color: var(--accent); font-size: 14px; font-weight: 500; }
        
        .main-card {
            margin: 20px;
            height: 200px;
            border-radius: 20px;
            background: url('https://i.imgur.com/VkZ6DsQ.png') no-repeat center;
            background-size: cover;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        
        .card-content {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
        }
        .card-name { font-size: 24px; font-weight: 700; margin: 0; }
        .card-logo { position: absolute; top: 20px; right: 20px; width: 60px; }

        /* Bottom Bar Styling */
        .bottom_bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(26, 27, 38, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            padding: 10px 0 30px 0;
            z-index: 100;
        }
        .bottom_bar_grid {
            display: flex;
            justify-content: space-around;
        }
        .bottom_element_grid { text-align: center; cursor: pointer; opacity: 0.5; }
        .bottom_element_grid.open { opacity: 1; }
        .bottom_element_image { width: 24px; height: 24px; margin: 0 auto 5px auto; background-size: contain; background-repeat: no-repeat; }
        .bottom_element_text { font-size: 10px; margin: 0; }

        .home_open { background-image: url('https://i.imgur.com/30pODeI.png'); } /* Simplified for demo */
        .services { background-image: url('https://i.imgur.com/pBv3be9.png'); }
        .qr { background-image: url('https://i.imgur.com/VkZ6DsQ.png'); }
        .more { background-image: url('https://i.imgur.com/U7TRg0V.png'); }
    </style>
</head>
<body>
    <div class="top_grid">
        <img src="https://i.imgur.com/30pODeI.png" class="top_image">
        <img src="https://i.imgur.com/pBv3be9.png" class="top_image">
    </div>

    <div class="card_grid">
        <p class="title">Dokumenty</p>
        <div class="subtitle-row">
            <span>Dostosuj</span>
            <span>Dodaj</span>
        </div>
    </div>

    <div class="main-card" onclick="sendTo('card')">
        <img src="https://i.imgur.com/hejpCzx.png" class="card-logo">
        <div class="card-content">
            <p class="card-name">mDowód</p>
        </div>
    </div>

    <div class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid open" send="home">
                <div class="bottom_element_image home_open"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" send="services">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" send="qr">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" send="more">
                <div class="bottom_element_image more"></div>
                <p class="bottom_element_text">Więcej</p>
            </div>
        </div>
    </div>

    <script src="assets/bar.js"></script>
</body>
</html>
