<!DOCTYPE html>
<html lang="pl">
<head>
    <title>mObywatel - Więcej</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="assets/main.css">
    <link rel="manifest" href="manifest.json">
    <style>
        .header {
            padding: 40px 20px 20px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-logo { width: 120px; }
        .logout-btn { color: #ff4444; font-size: 14px; font-weight: 700; cursor: pointer; }

        .section-title {
            padding: 0 20px;
            font-size: 12px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 30px;
        }

        .list-container {
            margin: 10px 20px;
            background: var(--card-bg);
            border-radius: 15px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:active { background: rgba(255,255,255,0.05); }

        .item-icon { width: 24px; height: 24px; margin-right: 15px; opacity: 0.7; }
        .item-text { font-size: 14px; flex: 1; }
        .item-arrow { width: 12px; opacity: 0.3; }

        .admin-link {
            text-align: center;
            margin-top: 40px;
            color: #333;
            font-size: 10px;
            cursor: pointer;
            padding: 10px;
        }

        /* Bottom Bar */
        .bottom_bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(26, 27, 38, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            padding: 10px 0 30px 0;
            z-index: 100;
        }
        .bottom_bar_grid {
            display: flex;
            justify-content: space-around;
        }
        .bottom_element_grid { text-align: center; cursor: pointer; opacity: 0.5; }
        .bottom_element_grid.open { opacity: 1; }
        .bottom_element_image { width: 24px; height: 24px; margin: 0 auto 5px auto; background-size: contain; background-repeat: no-repeat; }
        .bottom_element_text { font-size: 10px; margin: 0; }

        .home_open { background-image: url('https://i.imgur.com/30pODeI.png'); }
        .services { background-image: url('https://i.imgur.com/pBv3be9.png'); }
        .qr { background-image: url('https://i.imgur.com/VkZ6DsQ.png'); }
        .more_open { background-image: url('https://i.imgur.com/U7TRg0V.png'); }
    </style>
</head>
<body>
    <div class="header">
        <p style="font-size: 32px; font-weight: 700; margin: 0;">Więcej</p>
        <span class="logout-btn" onclick="location.href='index.html'">Wyloguj się</span>
    </div>

    <p class="section-title">Twoje dane</p>
    <div class="list-container">
        <div class="list-item">
            <img src="https://i.imgur.com/30pODeI.png" class="item-icon">
            <span class="item-text">Dane zameldowania</span>
            <img src="https://i.imgur.com/lTxuUMF.png" class="item-arrow">
        </div>
        <div class="list-item">
            <img src="https://i.imgur.com/pBv3be9.png" class="item-icon">
            <span class="item-text">Dane paszportu</span>
            <img src="https://i.imgur.com/lTxuUMF.png" class="item-arrow">
        </div>
    </div>

    <p class="section-title">Ustawienia</p>
    <div class="list-container">
        <div class="list-item">
            <img src="https://i.imgur.com/U7TRg0V.png" class="item-icon">
            <span class="item-text">Logowanie biometryczne</span>
            <img src="https://i.imgur.com/lTxuUMF.png" class="item-arrow">
        </div>
        <div class="list-item">
            <img src="https://i.imgur.com/U7TRg0V.png" class="item-icon">
            <span class="item-text">Zmień kod PIN</span>
            <img src="https://i.imgur.com/lTxuUMF.png" class="item-arrow">
        </div>
    </div>

    <div class="admin-link" onclick="openAdmin()">Tryb deweloperski</div>

    <div class="bottom_bar">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" onclick="location.href='home.html'">
                <div class="bottom_element_image home_open"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" send="services">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" send="qr">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid open" send="more">
                <div class="bottom_element_image more_open"></div>
                <p class="bottom_element_text">Więcej</p>
            </div>
        </div>
    </div>

    <script src="assets/bar.js"></script>
    <script>
        function openAdmin() {
            let pin = prompt("Wprowadź kod PIN administratora:");
            if (pin && btoa(pin) === "ODQ2Mg==") {
                window.location.href = "admin.html";
            } else if (pin) {
                alert("Odmowa dostępu");
            }
        }
    </script>
</body>
</html>
