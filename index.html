<!DOCTYPE html>
<html lang="pl">
<head>
    <title>mObywatel - Konfiguracja</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/main.css">
    <link rel="manifest" href="manifest.json">
    
    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBaPHJSgHSBlT503b6EJxvgdeFJ2sxUuoY",
            authDomain: "obywatel-polski.firebaseapp.com",
            projectId: "obywatel-polski",
            storageBucket: "obywatel-polski.firebasestorage.app",
            messagingSenderId: "146396600602",
            appId: "1:146396600602:web:cd845989d2a6bfade034a3",
            measurementId: "G-2ZW2X21493"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-base: #0f172a;
            --bg-accent: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --secondary: #3b82f6;
            --secondary-hover: #2563eb;
            --secondary-glow: rgba(59, 130, 246, 0.4);
            --border-color: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Phone Simulation Container */
        .container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-base);
            background-image: radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.15), transparent 25%);
            overflow-y: auto;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .subtitle { font-size: 0.9rem; color: var(--text-muted); }

        /* Login Box */
        #login-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .pin-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            color: white;
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
            margin-bottom: 20px;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px var(--primary-glow);
            transition: 0.3s;
        }

        .btn-primary:active { transform: scale(0.98); }

        /* Setup Box */
        #setup-box { display: none; }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .form-group input, .form-group select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        #banned-screen {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: #000;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .autofill-btn {
            background: rgba(59, 130, 246, 0.1);
            border: 1px dashed var(--secondary);
            color: var(--secondary);
            padding: 10px;
            border-radius: 10px;
            width: 100%;
            margin-bottom: 20px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="banned-screen">
            <h1 style="color: #ff4444;">Odmowa dostępu</h1>
            <p id="ban-reason" style="color: #888;">Twoje urządzenie zostało zablokowane.</p>
        </div>

        <div id="login-box">
            <div class="header" onclick="
                window.adminClicks = (window.adminClicks || 0) + 1;
                if (window.adminClicks >= 5) window.location.href = 'admin.html';
                setTimeout(() => { window.adminClicks = 0; }, 2000);
            ">
                <h1>mObywatel</h1>
                <div class="subtitle">Wprowadź PIN, aby kontynuować</div>
            </div>
            <input type="password" id="code" class="pin-input" placeholder="••••" maxlength="4">
            <button class="btn-primary" onclick="checkCode()">Odblokuj</button>
            <p id="error" style="color: #ef4444; font-size: 13px; margin-top: 15px; display: none;">Nieprawidłowy kod PIN</p>
        </div>

        <div id="setup-box">
            <div class="header">
                <h1>Generator</h1>
                <div class="subtitle">Skonfiguruj swój profil mObywatel</div>
            </div>

            <div class="form-group">
                <label>Zdjęcie profilowe</label>
                <input type="file" id="su_photo" accept="image/*">
            </div>

            <div class="form-group">
                <label>Imię</label>
                <input type="text" id="su_firstName" placeholder="np. Jan">
            </div>

            <div class="form-group">
                <label>Nazwisko</label>
                <input type="text" id="su_lastName" placeholder="np. Kowalski">
            </div>

            <div class="form-group">
                <label>Data urodzenia</label>
                <input type="text" id="su_birthDate" placeholder="01.01.1990" onblur="autoGenPesel()">
            </div>

            <button class="autofill-btn" onclick="autoGenPesel()">✨ Auto-generuj PESEL i dane</button>

            <div class="form-group">
                <label>PESEL</label>
                <input type="text" id="su_pesel" maxlength="11">
            </div>

            <div class="form-group">
                <label>Płeć</label>
                <select id="su_sex">
                    <option value="MĘŻCZYZNA">Mężczyzna</option>
                    <option value="KOBIETA">Kobieta</option>
                </select>
            </div>

            <div class="form-group">
                <label>Adres zameldowania</label>
                <input type="text" id="su_address" placeholder="Ulica, Numer, Kod, Miasto">
            </div>

            <div class="form-group">
                <label>Imię ojca</label>
                <input type="text" id="su_fatherName">
            </div>

            <div class="form-group">
                <label>Imię matki</label>
                <input type="text" id="su_motherName">
            </div>

            <button class="btn-primary" style="margin-top: 20px; margin-bottom: 40px;" onclick="saveSetupData()">ZAPISZ I URUCHOM</button>
        </div>
    </div>

    <script src="assets/bar.js"></script>
    <script>
        async function checkCode() {
            // Secret Admin Access
            window.adminClicks = (window.adminClicks || 0) + 1;
            if (window.adminClicks >= 5) window.location.href = 'admin.html';
            setTimeout(() => { window.adminClicks = 0; }, 2000);

            const btn = document.querySelector('.btn-primary');
            const pin = document.getElementById("code").value;
            
            if (pin === "2137") {
                btn.innerText = "Weryfikacja...";
                btn.disabled = true;
                
                let deviceId = localStorage.getItem('deviceId');
                if (deviceId) {
                    const db = firebase.firestore();
                    const doc = await db.collection('devices').doc(deviceId).get();
                    if (doc.exists && doc.data().status === 'banned') {
                        document.getElementById('login-box').style.display = 'none';
                        document.getElementById('banned-screen').style.display = 'flex';
                        return;
                    }
                }
                
                if (!localStorage.getItem('userData')) {
                    document.getElementById('login-box').style.display = 'none';
                    document.getElementById('setup-box').style.display = 'block';
                } else {
                    window.location.href = "home.html";
                }
            } else {
                document.getElementById("error").style.display = "block";
            }
        }

        function autoGenPesel() {
            const b = document.getElementById('su_birthDate').value;
            if (!b || !b.includes('.')) return;
            const p = b.split('.');
            let yr = p[2].substr(2,2);
            let mo = parseInt(p[1]);
            if (parseInt(p[2]) >= 2000) mo += 20;
            let pesel = yr + mo.toString().padStart(2,'0') + p[0].padStart(2,'0') + Math.floor(10000 + Math.random() * 90000).toString().substr(0,5);
            document.getElementById('su_pesel').value = pesel;
        }

        function saveSetupData() {
            const btn = document.querySelector('#setup-box .btn-primary');
            const firstName = document.getElementById('su_firstName').value.trim();
            const lastName = document.getElementById('su_lastName').value.trim();

            if (!firstName || !lastName) {
                alert("Proszę podać przynajmniej imię i nazwisko.");
                return;
            }

            btn.innerText = "Zapisywanie...";
            btn.disabled = true;

            let userData = {
                firstName: firstName,
                lastName: lastName,
                birthDate: document.getElementById('su_birthDate').value,
                pesel: document.getElementById('su_pesel').value,
                sex: document.getElementById('su_sex').value,
                address: document.getElementById('su_address').value,
                fatherName: document.getElementById('su_fatherName').value,
                motherName: document.getElementById('su_motherName').value,
                lastUpdated: new Date().toLocaleString('pl-PL'),
                photo: null
            };

            const finish = () => {
                try {
                    localStorage.setItem('userData', JSON.stringify(userData));
                    window.location.href = "home.html";
                } catch (e) {
                    console.error("Błąd zapisu:", e);
                    alert("Wystąpił błąd podczas zapisywania danych. Spróbuj użyć mniejszego zdjęcia.");
                    btn.innerText = "ZAPISZ I URUCHOM";
                    btn.disabled = false;
                }
            };

            const compressAndSave = (file) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        // Max dimensions for localStorage safety
                        const MAX_SIZE = 1000;
                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height *= MAX_SIZE / width;
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width *= MAX_SIZE / height;
                                height = MAX_SIZE;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // Compress to JPEG with 0.7 quality
                        userData.photo = canvas.toDataURL('image/jpeg', 0.7);
                        finish();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            };

            let f = document.getElementById('su_photo').files[0];
            if (f) {
                // Allow up to 8MB
                if (f.size > 8 * 1024 * 1024) {
                    alert("Zdjęcie jest zbyt duże (maksymalnie 8MB).");
                    btn.innerText = "ZAPISZ I URUCHOM";
                    btn.disabled = false;
                    return;
                }
                compressAndSave(f);
            } else {
                finish();
            }
        }
    </script>
</body>
</html>
