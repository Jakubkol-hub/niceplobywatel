<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Autoryzacja - mObywatel</title>

<link rel="stylesheet" href="assets/main.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<link rel="apple-touch-icon" href="https://i.imgur.com/U7TRg0V.png">

<!-- Firebase Compat Libraries -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

.box {
    width: 320px;
    padding: 40px;
    text-align: center;
    z-index: 1;
}

.logo-container { margin-bottom: 30px; }
h2 { margin: 0 0 10px 0; font-size: 24px; font-weight: 500; letter-spacing: 1px; color: #e0e0e0; }
p.subtitle { margin: 0 0 30px 0; font-size: 14px; color: #888; }

input {
    width: 100%;
    padding: 16px;
    margin-bottom: 20px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(0, 0, 0, 0.3);
    color: white;
    font-size: 16px;
    outline: none;
    transition: all 0.3s ease;
    box-sizing: border-box;
    text-align: center;
    letter-spacing: 4px;
}

input:focus { border-color: var(--accent); box-shadow: 0 0 20px rgba(41, 121, 255, 0.2); }

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    color: white;
    cursor: pointer;
    background: linear-gradient(135deg, #2979ff, #2962ff);
    box-shadow: 0 10px 20px rgba(41, 121, 255, 0.3);
    transition: all 0.3s ease;
}

#setup-box {
    display: none;
    width: 90%;
    max-width: 500px;
    height: 80vh;
    padding: 30px;
    text-align: left;
    z-index: 1;
    overflow-y: auto;
}

.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #bbb; }
.form-group input, .form-group select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(0, 0, 0, 0.3);
    color: white;
    font-size: 15px;
    outline: none;
    box-sizing: border-box;
    letter-spacing: normal;
    text-align: left;
}

.setup-btn { margin-top: 20px; }

#banned-screen {
    display: none;
    text-align: center;
    z-index: 2;
    position: absolute;
    background: #111;
    width: 100%;
    height: 100%;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.background-shapes {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 0;
    overflow: hidden;
}
.shape { position: absolute; border-radius: 50%; filter: blur(80px); }
.shape-1 { width: 300px; height: 300px; background: rgba(41, 121, 255, 0.2); top: -50px; left: -50px; }
.shape-2 { width: 400px; height: 400px; background: rgba(213, 0, 249, 0.1); bottom: -100px; right: -50px; }
</style>

</head>
<body>

<div class="background-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
</div>

<div id="banned-screen">
    <h1 style="color:#ff4444">Odmowa dostępu</h1>
    <p id="ban-reason">Twoje urządzenie zostało zablokowane.</p>
</div>

<div class="box glass-card" id="login-box">
    <div class="logo-container">
        <h2>Weryfikacja</h2>
        <p class="subtitle">mObywatel Premium</p>
    </div>

    <input type="password" id="code" placeholder="PIN" maxlength="4">
    <button onclick="checkCode()">Autoryzuj</button>
    <div id="error" style="color:#ff4444; font-size:12px; margin-top:10px; display:none;">Nieprawidłowy PIN</div>
</div>

<div id="setup-box" class="glass-card">
    <h2 style="text-align:center">Konfiguracja profilu</h2>
    <p style="text-align:center; color:#888; font-size:12px; margin-bottom:20px;">Wypełnij dane raz, aby wygenerować dokument.</p>
    
    <div class="form-group">
        <label>Zdjęcie profilowe</label>
        <input type="file" id="su_photo" accept="image/*">
    </div>
    <div class="form-group">
        <label>Imię (imiona)</label>
        <input type="text" id="su_firstName" placeholder="Jan">
    </div>
    <div class="form-group">
        <label>Nazwisko</label>
        <input type="text" id="su_lastName" placeholder="Kowalski">
    </div>
    <div class="form-group">
        <label>Data urodzenia (DD.MM.RRRR)</label>
        <input type="text" id="su_birthDate" placeholder="01.01.2000" onblur="autoGenPesel()">
    </div>
    <div class="form-group">
        <label>Numer PESEL (puste = auto)</label>
        <input type="text" id="su_pesel" placeholder="Automatycznie" maxlength="11">
    </div>

    <div class="form-group">
        <label>Imię ojca</label>
        <input type="text" id="su_fatherName" placeholder="Marek">
    </div>
    <div class="form-group">
        <label>Imię matki</label>
        <input type="text" id="su_motherName" placeholder="Anna">
    </div>
    <div class="form-group">
        <label>Miejsce urodzenia</label>
        <input type="text" id="su_birthPlace" placeholder="Warszawa">
    </div>
    <div class="form-group">
        <label>Adres zameldowania</label>
        <input type="text" id="su_address" placeholder="ul. Wiejska 1, 00-001 Warszawa">
    </div>

    <button class="setup-btn" onclick="saveSetupData()">Zapisz i kontynuuj</button>
</div>

<script>
// --- PWA SERVICE WORKER ---
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

// --- PESEL ---
function autoGenPesel() {
    const b = document.getElementById('su_birthDate').value;
    if (!b || !b.includes('.')) return;
    const p = b.split('.');
    const d = p[0], m = p[1], y = p[2];
    let yr = y.substr(2,2);
    let mo = parseInt(m);
    if (parseInt(y) >= 2000) mo += 20;
    let pesel = yr + mo.toString().padStart(2,'0') + d.padStart(2,'0') + Math.floor(10000 + Math.random() * 90000).toString().substr(0,5);
    document.getElementById('su_pesel').value = pesel;
}

// --- LOGIKA LOGOWANIA ---
function checkCode() {
    // Sprawdź czy zbanowany przed logowaniem
    let deviceId = localStorage.getItem('deviceId');
    if (deviceId && typeof firebase !== 'undefined') {
        const db = firebase.firestore();
        db.collection('devices').doc(deviceId).get().then(doc => {
            if (doc.exists && doc.data().status === 'banned') {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('banned-screen').style.display = 'flex';
                return;
            }
            proceedLogin();
        });
    } else {
        proceedLogin();
    }
}

function proceedLogin() {
    const code = document.getElementById("code").value;
    if (code === "2137") {
        if (!localStorage.getItem('userData')) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('setup-box').style.display = 'block';
        } else {
            window.location.href = "home.html";
        }
    } else {
        document.getElementById("error").style.display = "block";
    }
}

function saveSetupData() {
    let userData = {
        firstName: document.getElementById('su_firstName').value,
        lastName: document.getElementById('su_lastName').value,
        birthDate: document.getElementById('su_birthDate').value,
        pesel: document.getElementById('su_pesel').value,
        fatherName: document.getElementById('su_fatherName').value,
        motherName: document.getElementById('su_motherName').value,
        birthPlace: document.getElementById('su_birthPlace').value,
        address: document.getElementById('su_address').value,
        lastUpdated: new Date().toLocaleString('pl-PL'),
        photo: null
    };

    let f = document.getElementById('su_photo').files[0];
    if (f) {
        let r = new FileReader();
        r.onload = function(e) {
            userData.photo = e.target.result;
            localStorage.setItem('userData', JSON.stringify(userData));
            window.location.href = "home.html";
        };
        r.readAsDataURL(f);
    } else {
        localStorage.setItem('userData', JSON.stringify(userData));
        window.location.href = "home.html";
    }
}
</script>
<script src="assets/bar.js"></script>
</body>
</html>
