<!DOCTYPE html>
<html lang="pl">
<head>
    <title>mObywatel - mDowód</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="assets/main.css">
    <link rel="manifest" href="manifest.json">
    <style>
        .top_grid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px 10px 20px;
        }
        .back-link { display: flex; align-items: center; color: var(--accent); text-decoration: none; font-size: 14px; }
        .back-icon { width: 20px; margin-right: 5px; }
        .page-title { font-size: 18px; font-weight: 700; margin: 0; }

        .time-box { text-align: center; font-size: 12px; color: var(--text-sub); margin-bottom: 10px; }

        /* ID Card Area */
        .id-card-wrapper {
            position: relative;
            margin: 10px 20px;
            aspect-ratio: 1.58 / 1;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            background: #fff url('https://i.imgur.com/Ssv8rps.jpeg') no-repeat center;
            background-size: cover;
        }
        
        /* THE PHOTO */
        .id_own_image {
            position: absolute;
            top: 24%;
            left: 6%;
            width: 28%;
            height: 52%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 4px;
            z-index: 10;
            background-color: #ddd; /* Fallback */
        }

        .flag-gif { position: absolute; top: 10%; right: 5%; width: 15%; }
        .eagle-gif { position: absolute; bottom: 10%; right: 5%; width: 12%; }

        .id-data-text {
            position: absolute;
            top: 24%;
            left: 38%;
            width: 55%;
            color: #111;
            font-size: 8px;
            line-height: 1.2;
        }
        .data-val { font-size: 11px; font-weight: 700; color: #000; margin-bottom: 4px; display: block; }
        .data-label { font-size: 7px; color: #555; display: block; text-transform: uppercase; }

        /* Details Sections */
        .details-section {
            background: var(--card-bg);
            margin: 20px;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--border);
        }
        .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { font-size: 12px; color: var(--text-sub); }
        .detail-val { font-size: 14px; font-weight: 600; }

        /* Bottom Bar */
        .bottom_bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(26, 27, 38, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            padding: 10px 0 30px 0;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="top_grid">
        <a href="home.html" class="back-link">
            <img src="https://i.imgur.com/aXIO2NG.png" class="back-icon"> Wróć
        </a>
        <p class="page-title">mDowód</p>
        <img src="https://i.imgur.com/VHNv1TC.png" style="width:24px;">
    </div>

    <div class="time-box" id="time">Ładowanie...</div>

    <div class="id-card-wrapper">
        <div class="id_own_image" id="profile_photo"></div>
        <img src="https://i.imgur.com/I7oPp72.gif" class="flag-gif">
        <img src="https://i.imgur.com/EbBJWYb.gif" class="eagle-gif">
        
        <div class="id-data-text">
            <span class="data-label">Imię (imiona)</span>
            <span class="data-val" id="name">---</span>
            
            <span class="data-label">Nazwisko</span>
            <span class="data-val" id="surname">---</span>
            
            <span class="data-label">Obywatelstwo</span>
            <span class="data-val" id="nationality">---</span>
            
            <span class="data-label">Data urodzenia</span>
            <span class="data-val" id="birthday">---</span>
            
            <span class="data-label">Numer PESEL</span>
            <span class="data-val" id="pesel">---</span>
        </div>
    </div>

    <div class="details-section">
        <div class="detail-row">
            <span class="detail-label">Seria i numer mDowodu</span>
            <span class="detail-val">MWYC 24561</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Termin ważności</span>
            <span class="detail-val">14.07.2028</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Imię ojca</span>
            <span class="detail-val" id="fatherName">---</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Imię matki</span>
            <span class="detail-val" id="motherName">---</span>
        </div>
    </div>

    <div class="details-section" style="margin-bottom: 120px;">
        <p style="color: var(--accent); font-weight: 700; margin-top: 0;">Twoje dodatkowe dane</p>
        <div class="detail-row">
            <span class="detail-label">Miejsce urodzenia</span>
            <span class="detail-val" id="birthPlace">---</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Adres zameldowania</span>
            <span class="detail-val" id="adress" style="text-align: right; font-size: 12px;">---</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Ostatnia aktualizacja</span>
            <span class="detail-val" id="lastUpdatedDate">---</span>
        </div>
    </div>

    <script src="assets/bar.js"></script>
    <script>
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dateStr = now.toLocaleDateString('pl-PL');
            document.getElementById('time').innerText = "Czas: " + timeStr + "  " + dateStr;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
